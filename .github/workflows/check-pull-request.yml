# 'on:' triggers from the commented block below.
name: Check Pull Request

# on:
#   pull_request:
#     branches:
#       - main
#     types:
#       - opened
#       - edited
#       - reopened
#       - synchronize
#       - ready_for_review
on:
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scanning
    uses: ./.github/workflows/scan.yml
    secrets: inherit

  pr-validator:
    name: Run Pull Request Checks
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-python-backend-template .
          exit $?

  test:
    name: Run Journey Tests
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker build -t defradigital/ai-defra-search-agent:${{github.sha}} .
      - uses: DEFRA/ai-defra-search-journey-tests/run-journey-tests@main
        with:
          ai-defra-search-agent: ${{github.sha}}

